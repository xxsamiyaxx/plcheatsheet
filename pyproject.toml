[project]
name = "plcheatsheet"
version = "0.1.0"
description = "a CLI tool for quickly looking up programming or scripting languages"
readme = "README.md"
authors = [
    { name = "xxsamiyaxx" }
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = [
    "click>=8.5.1",
    "rich>=15.0.0",
]
[project.scripts]
plcs = "plcs.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "plcs"

[dependency-groups]
dev = [
    "pytest",
]